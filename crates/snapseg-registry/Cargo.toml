[package]
name = "snapseg-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "TOML-based model registry: declared model zoo, cache resolution, sha256-verified download."

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
sha2.workspace = true
directories.workspace = true
reqwest = { workspace = true, optional = true }
tracing.workspace = true

[features]
default = ["download"]
# Pulls in reqwest so missing models can be fetched at runtime. Disable
# for air-gapped industrial deployments that bundle ONNX files alongside
# the binary.
download = ["dep:reqwest"]
