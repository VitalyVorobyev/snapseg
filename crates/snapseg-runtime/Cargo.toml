[package]
name = "snapseg-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "ONNX Runtime wrapper for snapseg: execution-provider selection and tensor plumbing."

[dependencies]
snapseg-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
ndarray.workspace = true
ort.workspace = true
tracing.workspace = true

[features]
default = []
# Opt-in execution providers. CPU is always built. Others require the
# matching system libraries / SDKs to be installed. With `load-dynamic`
# these only enable the bindings code; provider availability is checked
# at runtime.
coreml = ["ort/coreml"]
cuda = ["ort/cuda"]
directml = ["ort/directml"]
tensorrt = ["ort/tensorrt"]
