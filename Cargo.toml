[workspace]
resolver = "2"
members = [
    "crates/snapseg-core",
    "crates/snapseg-runtime",
    "crates/snapseg-models",
    "crates/snapseg-registry",
    "crates/snapseg-edges",
    "crates/snapseg-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Vitaly Vorobyev <vit.vorobiev@gmail.com>"]
repository = "https://github.com/VitalyVorobyev/snapseg"

[workspace.dependencies]
snapseg-core = { path = "crates/snapseg-core", version = "0.1.0" }
snapseg-runtime = { path = "crates/snapseg-runtime", version = "0.1.0" }
snapseg-models = { path = "crates/snapseg-models", version = "0.1.0" }
snapseg-registry = { path = "crates/snapseg-registry", version = "0.1.0" }
snapseg-edges = { path = "crates/snapseg-edges", version = "0.1.0" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ndarray = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
directories = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

# Inference + UI deps are versioned here so adapter/app crates stay aligned.
# `load-dynamic` means the build does not link onnxruntime; the lib is
# looked up via ORT_DYLIB_PATH (or system path) at runtime. macOS dev
# expects `brew install onnxruntime`.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["ndarray", "load-dynamic"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
rfd = "0.15"

[profile.release]
lto = "thin"
codegen-units = 1
